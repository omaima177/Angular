<h1>Conferences</h1>

<div class="cards-container">
  @for (conf of conferances; track $index) {
    <div class="card">

      <img
        src="https://www.fisu.net/app/uploads/2024/01/DAA_1027-scaled.jpg"
        alt="Conference"
      />

      <div class="card-content">
        <h2>{{ conf.name }}</h2>

        <p>📅 {{ conf.date }}</p>
        <p>📍 {{ conf.place }}</p>

      </div>
      <button [routerLink]="['/details', conf.id]">Details</button>
    </div>
  }
</div>
